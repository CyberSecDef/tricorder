<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the safe-area insets in lcars.css have effect. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Tricorder</title>

    <!-- Standalone install only takes effect in Safari; Chrome and Edge on iOS
         cannot install a standalone web app, so the in-page chrome is designed
         to work in a tab with a URL bar consuming vertical space (§6). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tricorder" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Antonio is vendored in public/fonts (SIL OFL 1.1). It used to come from
         Google Fonts, which was the only request this app made to anything other
         than its own origin; serving it locally means a deployed copy talks to
         nobody. Preloaded because it is the display face for every heading and
         rail label, so a swap is visible on first paint. -->
    <link rel="preload" href="/fonts/antonio-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/antonio.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Tricorder requires JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
